-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">Hypar roof is generated from straight members (ruled surface): glulam rafters</text><text x="651.00" y="33.60" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">on steel edge beams, timber cassette deck, insulated membrane roof, oak batten</text><text x="651.00" y="37.20" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">soffit. Low point NW (drainage to rainwater tank for irrigation).</text><text x="651.00" y="42.00" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">Drive-thru clear height at pickup ≥ 4.39 m (vans/minibuses); height bar at</text><text x="651.00" y="45.60" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">lane entry 3.2 m.</text><text x="651.00" y="50.40" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">Café volume opens to the soffit: up to ~6.5 m clear at the SE corner — the</text><text x="651.00" y="54.00" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">glazed 'lantern' visible from the highway.</text><text x="651.00" y="58.80" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">Tower (11.0 m) carries the SE roof corner and the illuminated brand mark — the</text><text x="651.00" y="62.40" font-family="Inter, 'Noto Sans Armenian', Arial, sans-serif" font-size="2.25" text-anchor="start" font-weight="400" fill="#1d1d1b" letter-spacing="0">long-range identifier for westbound traffic.</text></svg>