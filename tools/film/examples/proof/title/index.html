<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proof title</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  .block { position: absolute; left: 112px; bottom: 74px; color: #fff; }
  h1 { margin: 0; font-family: "Fraunces", serif; font-weight: 300; font-size: 62px; line-height: 1.1; letter-spacing: -0.012em;
       text-shadow: 0 2px 30px rgba(0, 0, 0, 0.55); }
  h1 span { display: inline-block; white-space: pre; }
  p { margin: 22px 0 0; font-family: "Inter", sans-serif; font-weight: 500; font-size: 18px; letter-spacing: 0.26em;
      text-transform: uppercase; color: rgba(255, 255, 255, 0.78); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); }
  .rule { width: 0; height: 2px; background: #ffb454; margin-top: 24px; }
</style>
</head>
<body>
<div class="block">
  <h1 id="h"></h1>
  <div class="rule" id="rule"></div>
  <p id="p">Pipeline proof &nbsp;·&nbsp; 3840 × 2160 &nbsp;·&nbsp; 4 CPU cores, no GPU</p>
</div>
<script>
// Title for 3.3 s - 5.9 s of the film. Each word rises and fades in, 70 ms apart; all leave together.
const WORDS = ["One", " render.", "\n", "Every", " hour", " of", " the", " day."];
const IN = 3.3, OUT = 5.45;
const clamp = (x) => Math.min(1, Math.max(0, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 4);
const h = document.getElementById("h");
h.innerHTML = WORDS.map((w, i) => w === "\n" ? "<br>" : `<span data-i="${i}">${w}</span>`).join("");
window.seek = (t) => {
  const leave = easeOut((t - OUT) / 0.45);
  h.querySelectorAll("span").forEach((el) => {
    const a = easeOut((t - IN - 0.07 * Number(el.dataset.i)) / 0.7);
    el.style.opacity = a * (1 - leave);
    el.style.transform = `translateY(${(1 - a) * 26}px)`;
    el.style.filter = `blur(${(1 - a) * 6}px)`;
  });
  const r = easeOut((t - IN - 0.45) / 0.8);
  document.getElementById("rule").style.width = r * 150 + "px";
  document.getElementById("rule").style.opacity = 1 - leave;
  document.getElementById("p").style.opacity = easeOut((t - IN - 0.7) / 0.7) * (1 - leave);
};
window.seek(0);
</script>
</body>
</html>
